<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline | Wealth Compass</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f4;
        color: #111111;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1120; color: #e5e7eb; }
        p { color: #94a3b8 !important; }
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.4rem; margin: 20px 0 8px; }
      p { color: #6b7280; margin: 0 0 24px; line-height: 1.5; }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 14px;
        padding: 12px 22px;
        background: #111111;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/apple-touch-icon.png" alt="" />
      <h1>You're offline</h1>
      <p>Wealth Compass needs a connection to load your latest numbers.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
